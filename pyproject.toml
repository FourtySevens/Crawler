[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-crawler"
version = "0.1.0"
description = "A scoped website spider and passive security assessment tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
scope-crawler = "crawler.cli:main"

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.setuptools.package-data]
crawler = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
